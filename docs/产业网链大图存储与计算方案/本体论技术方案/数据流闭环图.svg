<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 950">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7a8a9a"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9aa5b0"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="950" height="950" fill="#fff"/>

  <!-- 标题 -->
  <text x="475" y="35" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a">数据流闭环与核心存储关系图</text>

  <!-- 1. 本体模型层 -->
  <g filter="url(#shadow)">
    <rect x="40" y="55" width="870" height="100" rx="6" fill="#f5f5fa" stroke="#6670a0" stroke-width="1.5"/>
  </g>
  <rect x="40" y="55" width="870" height="28" rx="6" fill="#6670a0"/>
  <rect x="40" y="77" width="870" height="6" fill="#6670a0"/>
  <text x="475" y="75" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#fff">本体模型（Ontology Schema Layer）</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#444">
    <rect x="60" y="95" width="200" height="48" rx="4" fill="#fff" stroke="#c5c8d8" stroke-width="1"/>
    <text x="160" y="113" text-anchor="middle" font-weight="bold" fill="#6670a0">Schema定义</text>
    <text x="160" y="130" text-anchor="middle" font-size="10" fill="#666">类/属性/关系/约束/术语/版本</text>

    <text x="275" y="120" fill="#7a8a9a" font-size="16">→</text>

    <rect x="295" y="95" width="200" height="48" rx="4" fill="#fff" stroke="#c5c8d8" stroke-width="1"/>
    <text x="395" y="113" text-anchor="middle" font-weight="bold" fill="#6670a0">语义规范/映射规则</text>
    <text x="395" y="130" text-anchor="middle" font-size="10" fill="#666">字段映射/转换逻辑/校验规则</text>

    <text x="510" y="120" fill="#7a8a9a" font-size="16">→</text>

    <rect x="530" y="95" width="250" height="48" rx="4" fill="#fff" stroke="#c5c8d8" stroke-width="1"/>
    <text x="655" y="113" text-anchor="middle" font-weight="bold" fill="#6670a0">本体语义映射 + 全局ID对齐</text>
    <text x="655" y="130" text-anchor="middle" font-size="10" fill="#666">跨源实体融合/消歧/标准化标识</text>

    <rect x="800" y="95" width="90" height="48" rx="4" fill="#eef0f8" stroke="#c5c8d8" stroke-width="1"/>
    <text x="845" y="120" text-anchor="middle" font-size="10" fill="#6670a0">OWL/RDFS</text>
    <text x="845" y="133" text-anchor="middle" font-size="9" fill="#888">本体描述</text>
  </g>

  <!-- 箭头 -->
  <line x1="475" y1="155" x2="475" y2="180" stroke="#7a8a9a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. 多源数据接入层 -->
  <g filter="url(#shadow)">
    <rect x="40" y="190" width="870" height="120" rx="6" fill="#f5fafa" stroke="#5090a0" stroke-width="1.5"/>
  </g>
  <rect x="40" y="190" width="870" height="28" rx="6" fill="#5090a0"/>
  <rect x="40" y="212" width="870" height="6" fill="#5090a0"/>
  <text x="475" y="210" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#fff">多源数据接入与标准化（Data Ingestion &amp; Normalization）</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#444">
    <rect x="60" y="230" width="140" height="65" rx="4" fill="#fff" stroke="#b5d0d8" stroke-width="1"/>
    <text x="130" y="250" text-anchor="middle" font-weight="bold" fill="#5090a0">多源接入</text>
    <text x="130" y="268" text-anchor="middle" font-size="10" fill="#666">API/CDC/爬虫</text>
    <text x="130" y="283" text-anchor="middle" font-size="10" fill="#666">文件批量导入</text>

    <text x="215" y="265" fill="#7a8a9a" font-size="14">→</text>

    <rect x="235" y="230" width="160" height="65" rx="4" fill="#fff" stroke="#b5d0d8" stroke-width="1"/>
    <text x="315" y="250" text-anchor="middle" font-weight="bold" fill="#5090a0">贴源存储</text>
    <text x="315" y="268" text-anchor="middle" font-size="10" fill="#666">文档/对象/结构化</text>
    <text x="315" y="283" text-anchor="middle" font-size="9" fill="#888">（原始保真，不做清洗）</text>

    <text x="410" y="265" fill="#7a8a9a" font-size="14">→</text>

    <rect x="430" y="230" width="180" height="65" rx="4" fill="#fff" stroke="#b5d0d8" stroke-width="1"/>
    <text x="520" y="250" text-anchor="middle" font-weight="bold" fill="#5090a0">标准明细层</text>
    <text x="520" y="268" text-anchor="middle" font-size="10" fill="#666">清洗+Markdown标准化</text>
    <text x="520" y="283" text-anchor="middle" font-size="9" fill="#888">（质量标注+结构识别）</text>

    <text x="625" y="265" fill="#7a8a9a" font-size="14">→</text>

    <rect x="645" y="230" width="245" height="65" rx="4" fill="#fff" stroke="#b5d0d8" stroke-width="1"/>
    <text x="767" y="250" text-anchor="middle" font-weight="bold" fill="#5090a0">语义对齐实例化</text>
    <text x="767" y="268" text-anchor="middle" font-size="10" fill="#666">standard_document + micro_document</text>
    <text x="767" y="283" text-anchor="middle" font-size="9" fill="#888">（按本体Schema生成知识单元）</text>
  </g>

  <!-- 箭头 -->
  <line x1="475" y1="310" x2="475" y2="335" stroke="#7a8a9a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. 数据要素层 -->
  <g filter="url(#shadow)">
    <rect x="40" y="345" width="870" height="160" rx="6" fill="#f5faf5" stroke="#608060" stroke-width="1.5"/>
  </g>
  <rect x="40" y="345" width="870" height="28" rx="6" fill="#608060"/>
  <rect x="40" y="367" width="870" height="6" fill="#608060"/>
  <text x="475" y="365" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#fff">数据要素层（语义与知识）</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#444">
    <rect x="60" y="390" width="250" height="100" rx="4" fill="#fff" stroke="#b8d0b8" stroke-width="1"/>
    <text x="185" y="412" text-anchor="middle" font-weight="bold" fill="#608060">本体模型</text>
    <text x="185" y="432" text-anchor="middle" font-size="10" fill="#666">类/属性/关系/约束/术语/版本</text>
    <text x="185" y="450" text-anchor="middle" font-size="9" fill="#888">语义规范与映射规则</text>
    <text x="185" y="468" text-anchor="middle" font-size="9" fill="#888">不存实例（MySQL元数据库）</text>

    <rect x="350" y="390" width="250" height="100" rx="4" fill="#fff" stroke="#b8d0b8" stroke-width="1"/>
    <text x="475" y="412" text-anchor="middle" font-weight="bold" fill="#608060">知识网络（5大核心）</text>
    <text x="475" y="432" text-anchor="middle" font-size="10" fill="#666">standard_document / micro_document</text>
    <text x="475" y="450" text-anchor="middle" font-size="10" fill="#666">entity / context / statement</text>
    <text x="475" y="468" text-anchor="middle" font-size="9" fill="#888">MongoDB + Neo4j + Milvus</text>

    <rect x="640" y="390" width="250" height="100" rx="4" fill="#fff" stroke="#b8d0b8" stroke-width="1"/>
    <text x="765" y="412" text-anchor="middle" font-weight="bold" fill="#608060">主题数仓</text>
    <text x="765" y="432" text-anchor="middle" font-size="10" fill="#666">指标口径/语义映射/主题宽表</text>
    <text x="765" y="450" text-anchor="middle" font-size="9" fill="#888">指标映射本体属性</text>
    <text x="765" y="468" text-anchor="middle" font-size="9" fill="#888">绑定实体ID可溯源（Doris）</text>
  </g>

  <!-- 分叉箭头 -->
  <path d="M475 505 L475 530 M475 530 L230 560 M475 530 L720 560" stroke="#7a8a9a" stroke-width="2" fill="none"/>
  <polygon points="230,570 225,560 235,560" fill="#7a8a9a"/>
  <polygon points="720,570 715,560 725,560" fill="#7a8a9a"/>

  <!-- 4. 知识库与数仓落地 -->
  <g filter="url(#shadow)">
    <rect x="60" y="575" width="830" height="130" rx="6" fill="#fafaf5" stroke="#a09060" stroke-width="1.5"/>
  </g>
  <rect x="60" y="575" width="830" height="26" rx="6" fill="#a09060"/>
  <rect x="60" y="595" width="830" height="6" fill="#a09060"/>
  <text x="475" y="593" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#fff">知识网络落地与语义派生（含图谱/向量索引）</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#555">
    <text x="475" y="625" text-anchor="middle">standard_document / micro_document / entity / context / statement 持久化</text>
    <text x="475" y="645" text-anchor="middle">+ 图谱边表/点表派生 + 向量索引构建</text>
    <text x="475" y="665" text-anchor="middle" fill="#888">• 知识溯源 / 校验 / 版本回溯</text>
    <text x="475" y="685" text-anchor="middle" fill="#888">• 主题数仓指标口径与实体ID对齐</text>
  </g>

  <!-- 汇合箭头 -->
  <line x1="475" y1="705" x2="475" y2="745" stroke="#7a8a9a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. 推理与检索服务层 -->
  <g filter="url(#shadow)">
    <rect x="40" y="755" width="870" height="70" rx="6" fill="#faf5fa" stroke="#906090" stroke-width="1.5"/>
  </g>
  <rect x="40" y="755" width="870" height="26" rx="6" fill="#906090"/>
  <rect x="40" y="775" width="870" height="6" fill="#906090"/>
  <text x="475" y="773" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#fff">推理与检索服务层（Query &amp; Inference Layer）</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#555">
    <text x="160" y="805" text-anchor="middle">Elasticsearch 全文检索</text>
    <text x="350" y="805" text-anchor="middle">向量数据库语义检索</text>
    <text x="540" y="805" text-anchor="middle">图谱推理引擎</text>
    <text x="730" y="805" text-anchor="middle">→ 统一API接口服务</text>
  </g>

  <!-- 箭头 -->
  <line x1="475" y1="825" x2="475" y2="855" stroke="#7a8a9a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. 反馈闭环层 -->
  <g filter="url(#shadow)">
    <rect x="40" y="865" width="870" height="70" rx="6" fill="#f8f8f8" stroke="#707070" stroke-width="1.5"/>
  </g>
  <rect x="40" y="865" width="870" height="26" rx="6" fill="#707070"/>
  <rect x="40" y="885" width="870" height="6" fill="#707070"/>
  <text x="475" y="883" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#fff">反馈闭环层</text>
  <text x="475" y="915" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#505050">推理结果 / 业务校验 → 回写知识网络 / 更新指标口径 / 触发本体模型迭代</text>

  <!-- 反馈回路箭头 -->
  <path d="M910 900 Q935 600 935 370 Q935 180 475 155" stroke="#9aa5b0" stroke-width="1.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowDash)"/>
  <text x="922" y="540" font-family="PingFang SC, sans-serif" font-size="9" fill="#7a8a9a" transform="rotate(90 922 540)">闭环反馈</text>
</svg>
