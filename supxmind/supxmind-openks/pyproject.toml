[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supxmind-openks"
version = "0.1.0"
description = "SupXmind knowledge computing engine scaffold"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "SupXmind OpenKS Team" }
]

[tool.setuptools.packages.find]
include = ["openks*"]

[tool.setuptools.package-data]
openks = [
  "kg/*/*/module.toml",
  "kg/*/*/config/*.yaml",
  "kg/*/*/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
