<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <defs>
    <linearGradient id="ontologyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="platformGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 本体论语义层 -->
  <rect x="20" y="20" width="760" height="120" rx="10" fill="url(#ontologyGrad)" opacity="0.9"/>
  <text x="400" y="50" text-anchor="middle" fill="white" font-size="16" font-weight="bold">本体论语义层（新增）</text>
  <g transform="translate(60, 70)">
    <rect x="0" y="0" width="120" height="50" rx="5" fill="white" opacity="0.9"/>
    <text x="60" y="30" text-anchor="middle" fill="#4F46E5" font-size="12">概念体系</text>
    <rect x="140" y="0" width="120" height="50" rx="5" fill="white" opacity="0.9"/>
    <text x="200" y="30" text-anchor="middle" fill="#4F46E5" font-size="12">实体类型体系</text>
    <rect x="280" y="0" width="120" height="50" rx="5" fill="white" opacity="0.9"/>
    <text x="340" y="30" text-anchor="middle" fill="#4F46E5" font-size="12">关系类型体系</text>
    <rect x="420" y="0" width="120" height="50" rx="5" fill="white" opacity="0.9"/>
    <text x="480" y="30" text-anchor="middle" fill="#4F46E5" font-size="12">事件类型体系</text>
    <rect x="560" y="0" width="120" height="50" rx="5" fill="white" opacity="0.9"/>
    <text x="620" y="30" text-anchor="middle" fill="#4F46E5" font-size="12">文档类型体系</text>
  </g>
  <!-- 连接箭头 -->
  <path d="M400 140 L400 180" stroke="#6B7280" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="400" y="165" text-anchor="middle" fill="#6B7280" font-size="11">语义映射与约束</text>
  <!-- 现有天蓬大数据平台 -->
  <rect x="20" y="190" width="760" height="110" rx="10" fill="url(#platformGrad)" opacity="0.9"/>
  <text x="400" y="220" text-anchor="middle" fill="white" font-size="16" font-weight="bold">现有天蓬大数据平台</text>
  <g transform="translate(80, 240)">
    <rect x="0" y="0" width="100" height="40" rx="5" fill="white" opacity="0.9"/>
    <text x="50" y="25" text-anchor="middle" fill="#059669" font-size="11">数据接入</text>
    <text x="115" y="25" fill="#059669" font-size="16">→</text>
    <rect x="130" y="0" width="100" height="40" rx="5" fill="white" opacity="0.9"/>
    <text x="180" y="25" text-anchor="middle" fill="#059669" font-size="11">数据存储</text>
    <text x="245" y="25" fill="#059669" font-size="16">→</text>
    <rect x="260" y="0" width="100" height="40" rx="5" fill="white" opacity="0.9"/>
    <text x="310" y="25" text-anchor="middle" fill="#059669" font-size="11">数据治理</text>
    <text x="375" y="25" fill="#059669" font-size="16">→</text>
    <rect x="390" y="0" width="100" height="40" rx="5" fill="white" opacity="0.9"/>
    <text x="440" y="25" text-anchor="middle" fill="#059669" font-size="11">数据分析</text>
    <text x="505" y="25" fill="#059669" font-size="16">→</text>
    <rect x="520" y="0" width="100" height="40" rx="5" fill="white" opacity="0.9"/>
    <text x="570" y="25" text-anchor="middle" fill="#059669" font-size="11">数据服务</text>
  </g>
</svg>